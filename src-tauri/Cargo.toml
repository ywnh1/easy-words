[package]
name = "easy-words"
version = "0.1.0"
description = "外研社高中英语词汇出题器"
authors = ["ywnh1"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "easy_words_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
docx-rs = "0.4"
printpdf = "0.7"
owned_ttf_parser = "0.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
