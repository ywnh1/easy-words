name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 前端类型检查 + Rust 测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖 (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Rust 测试（词库查询 + PDF 生成）
        working-directory: src-tauri
        run: cargo test --all-targets

  windows:
    name: Windows 安装包
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis,msi
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Easy Words {0}', github.ref_name) || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 不用 android-actions/setup-android：它用 Node 20 写成，现在被强制跑在
      # Node 24 上，内部的 sdkmanager --licenses 会退出码 1 而整步失败。
      # runner 镜像本来就预装了 SDK 与 NDK，直接把环境变量接上即可。
      - name: 检查预装的 Android SDK / NDK
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"
          test -d "${ANDROID_HOME:-/nonexistent}" || { echo "缺少 ANDROID_HOME"; exit 1; }
          test -n "${ANDROID_NDK_LATEST_HOME:-}" && test -d "$ANDROID_NDK_LATEST_HOME" \
            || { echo "缺少 NDK"; exit 1; }
          ls "$ANDROID_HOME/platforms" | tail -3
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Android 工程
        run: pnpm tauri android init --ci

      - name: 写入签名配置
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/src-tauri/keystore/easywords.jks
          storePassword=easy-words
          keyAlias=easywords
          keyPassword=easy-words
          EOF
          cat src-tauri/gen/android/keystore.properties

      # Tauri 的 gradle 模板不含 signingConfigs，光有 keystore.properties
      # 没人读，release APK 会是未签名的。这一步把它接上。
      - name: 注入 release 签名配置
        run: node scripts/patch-android-signing.mjs src-tauri/gen/android

      - name: 构建 APK
        # 只打 arm64：覆盖绝大多数真机，x86_64 只有模拟器用得上，
        # 四个 ABI 全打会让 CI 时长翻好几倍
        run: pnpm tauri android build --apk --ci --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
